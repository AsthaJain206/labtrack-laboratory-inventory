
{% extends "base.html" %}

{% block title %}Edit Equipment{% endblock %}

{% block content %}
<h1>Edit Equipment</h1>
<p>Update the details and save them to the database.</p>

<form method="POST" class="form-card">
    <label>Equipment Name *</label>
    <input type="text" name="name"
           value="{{ item.name }}" required>

    <label>Category</label>
    <input type="text" name="category"
           value="{{ item.category or '' }}">

    <label>Model</label>
    <input type="text" name="model"
           value="{{ item.model or '' }}">

    <label>Brand</label>
    <input type="text" name="brand"
           value="{{ item.brand or '' }}">

    <label>Serial Number</label>
    <input type="text" name="serial_no"
           value="{{ item.serial_no or '' }}">

    <label>Condition</label>
    <select name="condition">
        {% for c in ['Good', 'Fair', 'Poor', 'Damaged'] %}
        <option value="{{ c }}"
            {% if item.condition == c %}selected{% endif %}>
            {{ c }}
        </option>
        {% endfor %}
    </select>

    <label>Purchase Date</label>
    <input type="date" name="purchase_date"
           value="{{ item.purchase_date or '' }}">

    <label>Laboratory *</label>
    <select name="lab_id" required>
        {% for lab in laboratories %}
        <option value="{{ lab.lab_id }}"
            {% if item.lab_id == lab.lab_id %}selected{% endif %}>
            {{ lab.name }}
        </option>
        {% endfor %}
    </select>

    <label>Supplier</label>
    <select name="supplier_id">
        <option value="">No supplier</option>
        {% for supplier in suppliers %}
        <option value="{{ supplier.supplier_id }}"
            {% if item.supplier_id == supplier.supplier_id %}
            selected
            {% endif %}>
            {{ supplier.name }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Save Changes</button>
    <a href="{{ url_for('equipment') }}">Cancel</a>
</form>
{% endblock %}
